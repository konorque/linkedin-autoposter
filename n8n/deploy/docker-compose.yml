services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=Europe/Kyiv
      - TZ=Europe/Kyiv
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_RUNNERS_ENABLED=true
      # хранить историю запусков 14 дней, чтобы не забивать диск
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal]

  # Превращает публичные Telegram-каналы в RSS.
  # Наружу не открыт: n8n обращается к нему как http://rsshub:1200
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=memory
    networks: [internal]

  # HTTPS-прокси с автоматическим сертификатом Let's Encrypt
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  internal:
